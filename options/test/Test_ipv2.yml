name: Test_ipv2.yml
model_type: MultiFrameVDModel
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

datasets:
  test:
    name: MultiFrameVD
    type: MultiFrameVDPairedImageDataset
    dataroot_gt: ../datasets/optical/iphone/test/target
    dataroot_lq: ../datasets/optical/iphone/test/source
    io_backend:
      type: disk
    batch_size: 1
    num_worker: 0

# network structures
network:
  type: AVDNet

# path
path:
  pretrain_network: experiments/Train_ipv2.yml/models/net_latest.pth
  strict_load: false
  param_key: 'params_ema'

# validation settings
val:
  save_img: true
  metrics:
    psnr:
      type: calculate_vd_psnr
    ssim:
      type: calculate_vd_ssim
